SPECIFICATION Spec

\* Naive (no-snapshot) TOCTOU configuration.
\* UseSnapshot=FALSE: pipeline steps read liveHasCred directly.
\* DisableKey can race with any step; if it fires after TakeSnapshot but before
\* a masking step, liveHasCred becomes FALSE and the step skips masking, leaking
\* the credential.
\* Parallels Lean theorem: SnapshotConsistency (the snapshot pattern is what
\* makes TOCTOU safe; removing it breaks safety).
\* Expected result: NoCredentialLeak VIOLATED (counterexample shows DisableKey
\* racing with a masking step).

CONSTANTS
    ServerEncodings = { "none", "raw", "json_esc", "b64",
                        "pct_raw", "pct_b64", "pct_stray", "pct_plus_b64", "trunc" }
    ExtraStep4Catches = { "pct_stray", "pct_plus_b64" }
    UseSnapshot = FALSE
    Step4Enabled = TRUE

INVARIANT TypeOK
INVARIANT NoCredentialLeak
INVARIANT ResolvedImpliesAllowed
