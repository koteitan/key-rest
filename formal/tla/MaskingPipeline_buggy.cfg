SPECIFICATION Spec

\* Buggy decoder configuration: mirrors pre-v1.0.2 implementation.
\*   pre-v1.0.1: url.QueryUnescape all-or-nothing — stray '%' disables masking
\*               ("pct_stray" not caught by Step 4)
\*   pre-v1.0.2: url.QueryUnescape converts '+' to space — base64 with '+' missed
\*               ("pct_plus_b64" not caught by Step 4)
\* Parallels Lean theorems:
\*   buggy_leaks_stray_pct  = true  (pct_stray leaks in buggy model)
\*   fixed_misses_plus_b64  = true  (pct_plus_b64 leaks in v1.0.1 model)
\* Expected result: NoCredentialLeak VIOLATED for pct_stray and pct_plus_b64.

CONSTANTS
    ServerEncodings = { "none", "raw", "json_esc", "b64",
                        "pct_raw", "pct_b64", "pct_stray", "pct_plus_b64", "trunc" }
    ExtraStep4Catches = {}
    UseSnapshot = TRUE
    Step4Enabled = TRUE

INVARIANT TypeOK
INVARIANT NoCredentialLeak
INVARIANT ResolvedImpliesAllowed
