SPECIFICATION Spec

\* Non-vacuity check: ServerEncodings contains encodings outside Covered.
\* Expected result: NoCredentialLeak VIOLATED (base64url / hex / rot13 slip through).
\* This proves the model can fail — it is not a tautology.

CONSTANTS
    ServerEncodings = { "none", "raw", "json_esc", "b64",
                        "pct_raw", "pct_b64", "pct_stray", "pct_plus_b64", "trunc",
                        "base64url", "hex", "rot13" }
    ExtraStep4Catches = { "pct_stray", "pct_plus_b64" }
    UseSnapshot = TRUE
    Step4Enabled = TRUE

INVARIANT TypeOK
INVARIANT NoCredentialLeak
INVARIANT ResolvedImpliesAllowed
