SPECIFICATION Spec

\* Disorder (step 4 omitted) configuration.
\* Step4Enabled=FALSE: EffectiveStep4Catches = {}, so pct_raw and pct_b64
\* are never caught regardless of the decoder.  Demonstrates that step 4
\* is load-bearing — omitting it leaks percent-encoded credentials.
\* Parallels Lean theorem: masks_pct_raw and masks_pct_b64 hold only because
\* step 4 is present and fires in the correct position.
\* Expected result: NoCredentialLeak VIOLATED for pct_raw, pct_b64, pct_stray,
\* pct_plus_b64.

CONSTANTS
    ServerEncodings = { "none", "raw", "json_esc", "b64",
                        "pct_raw", "pct_b64", "pct_stray", "pct_plus_b64", "trunc" }
    ExtraStep4Catches = { "pct_stray", "pct_plus_b64" }
    UseSnapshot = TRUE
    Step4Enabled = FALSE

INVARIANT TypeOK
INVARIANT NoCredentialLeak
INVARIANT ResolvedImpliesAllowed
